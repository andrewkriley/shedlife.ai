services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: theshed
      POSTGRES_PASSWORD: theshed
      POSTGRES_DB: theshed
    ports:
      - "5432:5432"
    volumes:
      - theshed-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theshed"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - theshed-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  theshed-postgres:
  theshed-redis:
