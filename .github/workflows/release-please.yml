name: release-please

on:
  # Manual only. A human starts this from the Actions tab (Run workflow).
  # Cloud Agents and workers must not dispatch it — see RELEASING.md.
  # Re-enable `push: branches: [main]` only if we want the standing Release
  # PR to update on every main merge; tagging still waits for a human to
  # merge that PR in the GitHub UI.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # GitHub Environment `release` is the GUI approval gate. Configure it
    # with required reviewers (the maintainer) and limit it to `main`.
    # An unprotected environment does not enforce anything.
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Same job: GITHUB_TOKEN cannot start a second workflow after it
      # creates the GitHub Release, so attach-install-script.yml never
      # sees `release: published` from this path.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: ${{ steps.release.outputs.tag_name }}
      - name: Attach install.sh to the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" bootstrap/install.sh --clobber
