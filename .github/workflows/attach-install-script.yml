name: attach-install-script

# Fallback for releases that were not created by release-please.yml
# (GitHub UI, or a re-run). The happy path attaches in the same
# release-please job — GITHUB_TOKEN cannot start this workflow.
# Cloud Agents and workers must not dispatch this — see RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. theshed-v0.4.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Attach install.sh to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" bootstrap/install.sh --clobber
