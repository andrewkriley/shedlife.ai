name: trivy

# Filesystem/dependency scan, not the container-image scan docs/spec/release-
# pipeline.md's `release.yml` describes — there's no Dockerfile yet (no
# deployment target has been designed; that's Bootstrap/Fleet work, out of
# scope for this slice), so there's no image to build or scan on tag. This
# is the useful subset available now: known-vulnerability scanning of the
# backend's (uv.lock) and frontend's (package-lock.json) own dependencies,
# on every push/PR. Report-only (exit-code 0) for this first landing, so it
# surfaces a baseline without unexpectedly failing existing PRs on
# transitive-dependency CVEs no one has triaged yet — worth revisiting once
# that baseline is clean.
#
# Results print to the job log (table format) rather than uploading SARIF
# to GitHub code scanning: that upload needs GitHub Advanced Security, which
# is free on public repos but paid on private ones — and this repo is
# currently private. Revisit uploading SARIF (and re-adding CodeQL, dropped
# for the same reason) if/when the repo goes public.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: trivy (filesystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table
