name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: theshed
          POSTGRES_PASSWORD: theshed
          POSTGRES_DB: theshed
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U theshed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://theshed:theshed@localhost:5432/theshed
        run: uv run alembic upgrade head
      - name: ruff
        run: uv run ruff check src tests
      - name: mypy
        run: uv run mypy src
      - name: pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://theshed:theshed@localhost:5432/theshed
          TEST_REDIS_URL: redis://localhost:6379/15
        run: uv run pytest

  frontend:
    name: frontend (vitest, oxlint, tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: oxlint
        run: npm run lint
      - name: tsc
        run: npx tsc -b
      - name: vitest
        run: npm run test
