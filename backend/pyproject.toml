[project]
name = "theshed"
version = "0.1.0"
description = "The Shed — agentic-first AI harness (Assist / Build / Run)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    "galileo>=1.0",
    "python-dotenv>=1.0",
    "openai>=3.16.2",
    "mcp>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "freezegun>=1.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: `Depends(...)` in a default argument is FastAPI's own idiomatic
# dependency-injection pattern, not the footgun this rule targets elsewhere.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "galileo.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# httpx2 is mcp's own vendored HTTP client, needed to attach an auth header
# to streamable_http_client — not part of the package's declared public
# exports, so strict mode's implicit-reexport check flags importing it
# directly even though it's the documented way to configure auth.
module = "mcp.*"
ignore_missing_imports = true
implicit_reexport = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theshed"]
